{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Transfer — Gringotts Bank{% endblock title %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1>🤝 Transfer Money</h1>
    <p>Send money to another Gringotts customer by username.</p>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-primary" type="submit">Send Money</button>
      <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock content %}

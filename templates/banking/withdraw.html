{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Withdraw — Gringotts Bank{% endblock title %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1>💸 Withdraw Money</h1>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-warning" type="submit">Withdraw</button>
      <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock content %}

<!-- templates/registration/login.html -->
{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log In - Gringotts Bank{% endblock title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1>Log In</h1>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-primary" type="submit">Log In</button>
        </form>
        <p class="mt-3">
            No account yet? <a href="{% url 'signup' %}">Sign up</a> and get $1,000!
        </p>
    </div>
</div>
{% endblock content %}

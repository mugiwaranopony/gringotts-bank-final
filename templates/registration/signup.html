{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign Up — Gringotts Bank{% endblock title %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1>Sign Up</h1>
    <p>Open your account and receive a <strong>$1,000 welcome bonus</strong>.</p>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary" type="submit">Sign Up</button>
    </form>
  </div>
</div>
{% endblock content %}
